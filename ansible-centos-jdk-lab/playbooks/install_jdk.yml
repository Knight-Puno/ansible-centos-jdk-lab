---
- name: Install and configure JDK 1.8.0_121
  hosts: jdk_servers
  become: true

  vars_files:
    - ../vars/common.yml

  tasks:
    - name: Install unzip
      ansible.builtin.yum:
        name: unzip
        state: present
      tags: jdk

    - name: Create JDK install directory
      ansible.builtin.file:
        path: "{{ jdk_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: jdk

    - name: Copy JDK package to managed nodes
      ansible.builtin.copy:
        src: "{{ jdk_package }}"
        dest: "{{ jdk_remote_package }}"
        owner: root
        group: root
        mode: '0644'
      tags: jdk

    - name: Unzip JDK
      ansible.builtin.unarchive:
        src: "{{ jdk_remote_package }}"
        dest: "{{ jdk_install_dir }}"
        remote_src: true
        creates: "{{ jdk_home }}/bin/java"
      tags: jdk

    - name: Set JDK ownership
      ansible.builtin.file:
        path: "{{ jdk_home }}"
        owner: root
        group: root
        recurse: true
      tags: jdk

    - name: Find JDK executable files
      ansible.builtin.find:
        paths:
          - "{{ jdk_home }}/bin"
          - "{{ jdk_home }}/jre/bin"
        file_type: file
        recurse: false
      register: jdk_commands
      tags: jdk

    - name: Add execute permission to JDK commands
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0755'
      loop: "{{ jdk_commands.files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: jdk

    - name: Configure Java environment variables
      ansible.builtin.copy:
        dest: /etc/profile.d/java.sh
        owner: root
        group: root
        mode: '0644'
        content: |
          export JAVA_HOME={{ jdk_home }}
          export JRE_HOME=$JAVA_HOME/jre
          export CLASSPATH=.:$JAVA_HOME/lib:$JRE_HOME/lib
          export PATH=$JAVA_HOME/bin:$JRE_HOME/bin:$PATH
      tags: jdk

    - name: Check Java version
      ansible.builtin.command:
        cmd: "{{ jdk_home }}/bin/java -version"
      register: java_version
      changed_when: false
      tags: verify

    - name: Check Javac version
      ansible.builtin.command:
        cmd: "{{ jdk_home }}/bin/javac -version"
      register: javac_version
      changed_when: false
      tags: verify

    - name: Show Java version
      ansible.builtin.debug:
        var: java_version.stderr_lines
      tags: verify

    - name: Show Javac version
      ansible.builtin.debug:
        var: javac_version.stdout_lines
      tags: verify

    - name: Remove temporary JDK package
      ansible.builtin.file:
        path: "{{ jdk_remote_package }}"
        state: absent
      tags: cleanup

---
- name: Ansible keyword demo
  hosts: jdk_servers
  become: true
  gather_facts: true

  vars:
    demo_dir: /opt/ansible-demo

  tasks:
    - name: Create demo directory
      ansible.builtin.file:
        path: "{{ demo_dir }}"
        state: directory
        mode: '0755'
      tags: create

    - name: Create demo files with loop
      ansible.builtin.copy:
        dest: "{{ demo_dir }}/{{ item }}"
        content: "created by ansible\n"
        mode: '0644'
      loop:
        - file1.txt
        - file2.txt
        - file3.txt
      tags: loop

    - name: Get hostname
      ansible.builtin.command:
        cmd: hostname
      register: hostname_result
      changed_when: false
      tags: register

    - name: Show hostname and IP
      ansible.builtin.debug:
        msg: "host={{ hostname_result.stdout }}, ip={{ ansible_default_ipv4.address }}"
      when: hostname_result.rc == 0
      tags: when
